<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="singa-a-title singa-a-desc">
<title id="singa-a-title">singa — The one instance</title>
<desc id="singa-a-desc">One luminous instance stands on a permanent pedestal; three access marks approach the same object.</desc>
<style>
:root{--accent:#bc9538;--second:#678792;--ink:#253447;--paper:#f7fafc;--line:#8394a7;--wash:#bc953818}
@media(prefers-color-scheme:dark){:root{--ink:#e4ebf3;--paper:#182332;--line:#8495aa;--wash:#bc953822}}
.a{stroke:var(--accent)}.b{stroke:var(--second)}.af{fill:var(--accent)}.bf{fill:var(--second)}.ink{fill:var(--ink)}.paper{stroke:var(--line)}.line{stroke:var(--line)}.wash{fill:var(--wash)}.white{fill:#fff}.neutral{fill:var(--paper)}
</style>
